<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>理赔协查应答智能体 · 杨昀昊</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --teal: #1f5c57;
      --ink: #1a2422;
      --muted: #5a6b68;
      --bg: #f3f7f6;
      --line: rgba(31, 92, 87, 0.14);
      --shadow: 0 16px 36px rgba(26, 36, 34, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", "Noto Sans SC", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #eef5f3 0%, var(--bg) 40%, #e8f0ee 100%);
    }
    .page { width: min(900px, calc(100% - 2rem)); margin: 0 auto; padding: 2.25rem 0 3.5rem; }
    a { color: var(--teal); }
    .nav { margin-bottom: 1.5rem; }
    h1 { margin: 0.2rem 0 0.6rem; font-size: 1.7rem; }
    .context { color: var(--muted); line-height: 1.6; }
    .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin: 1rem 0 1.25rem; }
    .actions a { text-decoration: none; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 0.45rem 0.9rem; font-weight: 600; }
    .actions a.primary { background: var(--teal); color: #fff; border-color: var(--teal); }
    .viewer { background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
    .viewer iframe { display: block; width: 100%; height: min(78vh, 1100px); border: 0; background: #fafafa; }
    .note { margin: 0.85rem 1.1rem 1.1rem; font-size: 0.88rem; color: var(--muted); }
  </style>
</head>
<body>
  <main class="page">
    <nav class="nav"><a href="../">← 作品</a></nav>
    <h1>理赔协查应答智能体</h1>
    <p class="context">材料补件、进度应答与内部协查：检索知识、按白名单取数、生成草稿，经人工确认后回写。不做自动定损，也不做自动核赔。</p>
    <div class="actions">
      <a class="primary" href="./deck.pdf" download>下载演示 PDF</a>
      <a href="./deck.pptx" download>下载 PPTX</a>
    </div>
    <section class="viewer">
      <iframe title="理赔协查应答智能体演示稿" src="./deck.pdf#view=FitH"></iframe>
      <p class="note">若无法内嵌预览，请直接 <a href="./deck.pdf" target="_blank" rel="noopener">打开 PDF</a>。</p>
    </section>
  </main>
</body>
</html>
